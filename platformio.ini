[platformio]
default_envs = lqr_anti_oscilacion

[env:lqr_anti_oscilacion]
platform = ststm32@19.4.0
board = genericSTM32F401RC
framework = arduino
upload_protocol = stlink
monitor_speed = 115200
build_flags =
    -D PIO_FRAMEWORK_ARDUINO_NANOLIB_FLOAT_PRINTF
    -D HAL_IWDG_MODULE_ENABLED
    -D ENABLE_AUTO_LQR=1
    -D ENABLE_MANUAL_MOTORS=0
    -D ENABLE_AUTOSTART_LQR=1
    -D ENABLE_ESP32_TX=1

; Alternativa: mantener comandos/CSV por USB en lugar de USART6 PA11.
; No habilitar simultaneamente USB CDC y USART6 sobre PA11.
[env:lqr_anti_oscilacion_usb]
extends = env:lqr_anti_oscilacion
build_flags =
    -D PIO_FRAMEWORK_ARDUINO_ENABLE_CDC
    -D PIO_FRAMEWORK_ARDUINO_NANOLIB_FLOAT_PRINTF
    -D HAL_IWDG_MODULE_ENABLED
    -D ENABLE_AUTO_LQR=1
    -D ENABLE_MANUAL_MOTORS=0
    -D ENABLE_AUTOSTART_LQR=1
    -D ENABLE_ESP32_TX=0
